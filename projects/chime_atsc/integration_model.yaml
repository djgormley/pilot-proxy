# How the science analysis integrates a frame residual, for the residual chain.
frame_seconds: 0.04194304            # 16384 samples at 390625 Hz
coherence_cap_seconds: 86164.0905    # one mean sidereal day (the release literal)
# off: all surviving shelf power at n_coh(tau_c), no ground-filter credit (the
# 2026-09-24 no-split release). The other option, booked_when_tau_usable,
# books the intra-day/fast variance split where tau_c is usable (the
# 2026-09-23 author-eras release); the record configurations name it.
variance_split: "off"                  # quoted: YAML reads a bare off as false
