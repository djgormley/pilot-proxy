name: tests

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      # CPU-only job: the README smoke-test commands plus the full Python test
      # suite. No CUDA, GNU Radio, CADC, or HDF5 data required.
      - run: python -m pip install -U pip setuptools wheel
      - run: python -m pip install -e ".[test]"
      - run: pilot-proxy --help
      - run: pilot-proxy --version
      - run: python -m pytest tests -q
      - run: pilot-proxy check-profile --receiver-profile configs/receiver_profiles/reference_800mhz_pfb.json
      - run: pilot-proxy check-layout --receiver-profile configs/receiver_profiles/reference_800mhz_pfb.json

  cpu-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip setuptools wheel
      - run: python -m pip install -e ".[test]"
      - run: make release-check

  archive-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip setuptools wheel
      - run: python -m pip install -r requirements/archive.txt
      - run: python -m pip install -e ".[archive,test]"
      - run: make archive-integration-check

  wheel-resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip build
      - run: python -m build
      - name: Check wheel and sdist resource inventories
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          expected = {
              f"configs/{path.relative_to('configs').as_posix()}"
              for path in Path("configs").rglob("*.json")
          }
          expected.update(
              {
                  "weights/chime_dtv_weights_k128.bin",
                  "weights/chime_dtv_weights_k128.bin.manifest.json",
                  "weights/chord_dtv_weights_k64.bin",
                  "weights/chord_dtv_weights_k64.bin.manifest.json",
              }
          )
          expected.update(
              path.as_posix()
              for path in Path("projects").rglob("*")
              if path.is_file() and path.suffix in {".yaml", ".json"}
          )
          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))
          with zipfile.ZipFile(wheel) as archive:
              wheel_names = set(archive.namelist())
          with tarfile.open(sdist, "r:gz") as archive:
              sdist_names = set(archive.getnames())
          wheel_resources = {
              name.removeprefix("pilot_proxy/_resources/")
              for name in wheel_names
              if name.startswith("pilot_proxy/_resources/")
              and not name.endswith("/")
          }
          assert wheel_resources == expected, (wheel_resources - expected, expected - wheel_resources)
          for resource in expected:
              packaged = f"pilot_proxy/_resources/{resource}"
              assert packaged in wheel_names, (wheel, packaged)
              assert any(name.endswith(f"/{resource}") for name in sdist_names), (
                  sdist,
                  resource,
              )
          PY
      - name: Test isolated wheel install and relative-path CLI
        run: |
          python -m venv /tmp/pilot-proxy-wheel-test
          /tmp/pilot-proxy-wheel-test/bin/python -m pip install dist/*.whl
          mkdir -p /tmp/pilot-proxy-wheel-caller
          cd /tmp/pilot-proxy-wheel-caller
          /tmp/pilot-proxy-wheel-test/bin/python - <<'PY'
          import numpy as np
          from pilot_proxy.detector_weights import DetectorWeightBank
          from pilot_proxy.paths import (
              CONFIGS_DIR,
              DEFAULT_CHORD_WEIGHTS_PATH,
              DEFAULT_WEIGHTS_PATH,
          )

          assert (CONFIGS_DIR / "receiver_profiles" / "reference_800mhz_pfb.json").is_file()
          for path, expected_k in (
              (DEFAULT_WEIGHTS_PATH, 128),
              (DEFAULT_CHORD_WEIGHTS_PATH, 64),
          ):
              assert path.is_file(), path
              bank = DetectorWeightBank(explicit_path=path)
              assert bank.K == expected_k
              assert bank.supported_physical_channels() == list(range(14, 37))
          from pilot_proxy.config.project import default_project

          project = default_project().load_all()
          assert project.directory.parent.parent == CONFIGS_DIR.parent, project.directory
          rng = np.random.default_rng(20260816)
          iq = (rng.standard_normal(4096) + 1j * rng.standard_normal(4096)).astype(np.complex64)
          iq.tofile("relative-input.cfile")
          PY
          /tmp/pilot-proxy-wheel-test/bin/pilot-proxy audit-atsc \
            --input-iq relative-input.cfile --output-json relative-output.json
          test -s relative-output.json
          /tmp/pilot-proxy-wheel-test/bin/python \
            -m pilot_proxy.testbench.quantize --help >/dev/null
          /tmp/pilot-proxy-wheel-test/bin/python \
            -m pilot_proxy.testbench.evaluate_snr --help >/dev/null
      - name: Test wheel through a custom user base
        run: |
          PYTHONUSERBASE=/tmp/pilot-proxy-wheel-user \
            python -m pip install --user dist/*.whl
          mkdir -p /tmp/pilot-proxy-wheel-user-caller
          cd /tmp/pilot-proxy-wheel-user-caller
          PYTHONUSERBASE=/tmp/pilot-proxy-wheel-user python - <<'PY'
          from pathlib import Path
          from pilot_proxy.detector_weights import DetectorWeightBank
          from pilot_proxy.paths import DEFAULT_CHORD_WEIGHTS_PATH, DEFAULT_WEIGHTS_PATH

          user_base = Path("/tmp/pilot-proxy-wheel-user").resolve()
          for path, expected_k in (
              (DEFAULT_WEIGHTS_PATH, 128),
              (DEFAULT_CHORD_WEIGHTS_PATH, 64),
          ):
              assert path.is_file(), path
              assert path.is_relative_to(user_base), path
              assert DetectorWeightBank(explicit_path=path).K == expected_k
          PY
      - name: Test target-directory wheel install
        run: |
          mkdir -p /tmp/pilot-proxy-wheel-target
          python -m pip install \
            --target /tmp/pilot-proxy-wheel-target dist/*.whl
          cd /tmp
          PYTHONPATH=/tmp/pilot-proxy-wheel-target python -S - <<'PY'
          from pathlib import Path
          from pilot_proxy.detector_weights import DetectorWeightBank
          from pilot_proxy.paths import (
              CONFIGS_DIR,
              DEFAULT_CHORD_WEIGHTS_PATH,
              DEFAULT_WEIGHTS_PATH,
          )

          target = Path("/tmp/pilot-proxy-wheel-target").resolve()
          assert (CONFIGS_DIR / "receiver_profiles" / "reference_800mhz_pfb.json").is_file()
          for path, expected_k in (
              (DEFAULT_WEIGHTS_PATH, 128),
              (DEFAULT_CHORD_WEIGHTS_PATH, 64),
          ):
              assert path.is_file(), path
              assert path.is_relative_to(target), path
              assert DetectorWeightBank(explicit_path=path).K == expected_k
          assert CONFIGS_DIR.is_relative_to(target), CONFIGS_DIR
          PY
      - name: Test wheel built from the sdist
        run: |
          python -m venv /tmp/pilot-proxy-sdist-test
          /tmp/pilot-proxy-sdist-test/bin/python -m pip install dist/*.tar.gz
          cd /tmp
          /tmp/pilot-proxy-sdist-test/bin/python - <<'PY'
          from pilot_proxy.detector_weights import DetectorWeightBank
          from pilot_proxy.paths import DEFAULT_CHORD_WEIGHTS_PATH, DEFAULT_WEIGHTS_PATH

          assert DetectorWeightBank(explicit_path=DEFAULT_WEIGHTS_PATH).K == 128
          assert DetectorWeightBank(explicit_path=DEFAULT_CHORD_WEIGHTS_PATH).K == 64
          PY
      - name: Test an explicitly different GNU Radio Python wrapper
        run: |
          python -m venv /tmp/pilot-proxy-secondary-python
          /tmp/pilot-proxy-secondary-python/bin/python -m pip install numpy
          mkdir -p /tmp/pilot-proxy-external-caller
          cat > /tmp/pilot-proxy-python-probe <<'PY'
          #!/tmp/pilot-proxy-secondary-python/bin/python
          import os
          import sys
          from pathlib import Path

          assert sys.argv[1:3] == ["-m", "pilot_proxy.testbench.generate_atsc_signal"]
          import pilot_proxy.testbench.generate_atsc_signal
          import numpy
          bridge = Path(os.environ["PYTHONPATH"].split(os.pathsep)[0])
          assert sorted(path.name for path in bridge.iterdir()) == ["pilot_proxy"]
          numpy_path = Path(numpy.__file__).resolve()
          assert numpy_path.is_relative_to(Path(sys.prefix).resolve())
          assert not numpy_path.is_relative_to(Path("/tmp/pilot-proxy-wheel-test"))
          output_iq = Path(sys.argv[sys.argv.index("--output-iq") + 1])
          assert output_iq.is_absolute()
          assert output_iq.parent == Path.cwd()
          Path("secondary-interpreter-ok").write_text(
              str(numpy_path), encoding="utf-8"
          )
          PY
          chmod +x /tmp/pilot-proxy-python-probe
          cd /tmp/pilot-proxy-external-caller
          /tmp/pilot-proxy-wheel-test/bin/pilot-proxy generate-atsc \
            --gnuradio-python /tmp/pilot-proxy-python-probe \
            --output-iq relative-output.cfile \
            --output-ts relative-output.ts \
            --num-iq-samples 128 --num-ts-packets 16
          test -s secondary-interpreter-ok
