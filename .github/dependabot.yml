version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    # Recorded analysis environments stay unchanged.
    exclude-paths:
      - "requirements/**"
      - "docs/evidence/**"
      - "history/**"
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
