[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pilot-proxy"
dynamic = ["version"]
description = "PilotProxy pilot-informed CUDA local-reference power-ratio detector with GNU Radio ATSC 1.0 testbench"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Dylan Gormley" },
  { name = "WVU Radio Astronomy Instrumentation Lab (RAIL)" },
]
keywords = ["radio-astronomy", "RFI", "ATSC", "DTV-pilot", "power-ratio", "CUDA", "CHIME"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy",
  "pyyaml",
]

[project.optional-dependencies]
test = [
  "cryptography",
  "scipy",
  "h5py",
  "matplotlib",
  "pyyaml",
  "pytest>=8",
  "ruff>=0.9",
]
cuda = [
  "cupy-cuda12x",
]
plot = [
  "matplotlib",
]
chime = [
  "h5py",
  "pyyaml",
  "matplotlib",
]
archive = [
  "cadcdata>=2.5.0",
  "cadcutils>=1.5.1.1",
  "datatrail-cli>=0.11",
  "h5py",
  "pyyaml",
  "requests>=2.29.0",
]
n2 = [
  "h5py",
  "hdf5plugin",
]

[project.scripts]
pilot-proxy = "pilot_proxy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"pilot_proxy.instruments" = ["*.yaml"]
"pilot_proxy.characterization" = ["schemas/*.json"]

[tool.setuptools.dynamic]
version = {attr = "pilot_proxy._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pilot_proxy*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests/products"]
markers = [
  "cuda: requires CUDA runtime/GPU",
]

[tool.ruff]
target-version = "py310"
# docs/evidence holds frozen records of what was actually run, absolute paths and
# all. They are read as evidence, never imported, and editing one to satisfy a
# linter would alter the record it exists to preserve, so they are not linted.
# tools/capture/frame_analysis holds the capture ruling's scripts of record,
# byte copies of the frozen ruling tree whose hashes are pinned; the same holds.
# table_of_record.py alone takes its inputs from a configurable location (its
# README); given the same inputs it writes the same table.
extend-exclude = ["docs/evidence", "tools/capture/frame_analysis"]

[tool.ruff.lint]
# Start with correctness-oriented checks so legacy analysis scripts can be
# cleaned incrementally without making style changes a release blocker.
select = ["F"]
